media:
  input: media
  output: /media

content:
  - name: site
    label: 사무소 기본 정보
    type: file
    path: content/site.json
    fields:
      - { name: name, label: 상호, type: string }
      - { name: since, label: 연도 표기, type: string }
      - { name: slogan, label: 슬로건, type: string }
      - { name: representative, label: 대표, type: string }
      - { name: broker, label: 담당 공인중개사, type: string }
      - { name: broker_title, label: 담당자 직책, type: string }
      - { name: phone, label: 대표번호, type: string }
      - { name: mobile, label: 휴대전화 (표시용), type: string }
      - { name: sms_number, label: 상담 문자 받을 번호 (숫자만), type: string }
      - { name: kakao_url, label: 카카오톡 오픈채팅 주소 (비우지 마세요), type: string, required: true }
      - { name: hours, label: 영업시간, type: string }
      - { name: address, label: 주소, type: string }
      - { name: registration_no, label: 중개사무소 등록번호, type: string }
      - { name: business_no, label: 사업자등록번호, type: string }
      - { name: email, label: 개인정보 문의 이메일, type: string }
      - { name: privacy_officer, label: 개인정보 보호책임자, type: string }
      - { name: form_endpoint, label: 상담 접수 주소 (Apps Script 웹 앱 URL), type: string }
      - { name: privacy_retention, label: 상담 정보 보유 기간 (Apps Script와 같게), type: string }
      - { name: consent_version, label: 동의 문구 버전 (Apps Script와 같게), type: string }
      - { name: logo, label: 로고, type: image }
      - { name: emblem, label: 골드 R 엠블럼, type: image }

  - name: home
    label: 메인 페이지
    type: file
    path: content/home.json
    fields:
      - { name: hero_eyebrow, label: 첫 화면 위 작은 문구, type: string }
      - { name: hero_title, label: 첫 화면 큰 제목 (줄마다 한 칸), type: string, list: true }
      - { name: hero_lead, label: 첫 화면 설명, type: text }
      - { name: marquee, label: 흐르는 띠 문구, type: string }
      - { name: svc_title, label: 서비스 묶음 제목, type: string }
      - { name: svc_lead, label: 서비스 묶음 설명, type: string }
      - { name: host_title, label: 소개 제목, type: text }
      - { name: host_text, label: 소개 글, type: text }
      - { name: host_image, label: 소개 큰 사진, type: image }
      - { name: host_image_alt, label: 소개 큰 사진 설명, type: string }
      - { name: office_image, label: 소개 작은 사진, type: image }
      - { name: office_image_alt, label: 소개 작은 사진 설명, type: string }
      - name: facts
        label: 숫자 표기
        type: object
        list: true
        fields:
          - { name: value, label: 큰 글자, type: string }
          - { name: label, label: 설명, type: string }
      - { name: belief, label: 신념 문장, type: text }

  - name: about
    label: 회사소개
    type: file
    path: content/about.json
    fields:
      - { name: title, label: 제목, type: text }
      - { name: lead, label: 설명, type: text }
      - { name: history_title, label: 역사 제목, type: string }
      - { name: history_text, label: 역사 글 (빈 줄로 문단 구분), type: text }
      - { name: history_image, label: 역사 사진, type: image }
      - { name: history_image_alt, label: 역사 사진 설명, type: string }
      - name: methods
        label: 중개 방식
        type: object
        list: true
        fields:
          - { name: title, label: 제목, type: string }
          - { name: text, label: 설명, type: text }
      - { name: profile_title, label: 담당자 제목, type: string }
      - { name: profile_text, label: 담당자 소개, type: text }
      - { name: profile_image, label: 담당자 사진 (기존 홍보 이미지만), type: image }
      - { name: profile_image_alt, label: 담당자 사진 설명, type: string }

  - name: services
    label: 중개 서비스 (프로그램)
    type: file
    path: content/services.json
    fields:
      - { name: title, label: 제목, type: text }
      - { name: lead, label: 설명, type: text }
      - name: items
        label: 서비스 목록
        type: object
        list: true
        fields:
          - { name: key, label: 영문 키 (문의 분야 연결용, 바꾸지 마세요), type: string }
          - name: group
            label: 묶음
            type: select
            options:
              values:
                - { value: seek, label: 자리를 구하는 분 }
                - { value: own, label: 건물을 가진 분 }
                - { value: decide, label: 결정 전이라면 }
          - { name: name, label: 서비스 이름, type: string }
          - { name: who, label: 누가 이용하나요, type: text }
          - { name: checks, label: 확인하는 조건, type: string, list: true }
          - { name: tell, label: 상담할 때 알려주세요, type: text }
          - { name: image, label: 사진 (선택), type: image }

  - name: consulting
    label: 상권·입지 컨설팅
    type: file
    path: content/consulting.json
    fields:
      - { name: title, label: 제목, type: text }
      - { name: lead, label: 설명, type: text }
      - name: steps
        label: 진행 순서
        type: object
        list: true
        fields:
          - { name: title, label: 단계 이름, type: string }
          - { name: text, label: 설명, type: text }
      - name: compare
        label: 비교 항목
        type: object
        list: true
        fields:
          - { name: item, label: 항목, type: string }
          - { name: how, label: 무엇을 보나요, type: text }
      - { name: aftercare_title, label: 입점 후 제목, type: string }
      - { name: aftercare_text, label: 입점 후 설명, type: text }
      - { name: aftercare_points, label: 입점 후 도움 목록, type: string, list: true }
      - { name: renewal_title, label: 재계약 제목, type: string }
      - { name: renewal_text, label: 재계약 설명, type: text }

  - name: projects
    label: 중개 사례·고객 후기
    type: file
    path: content/projects.json
    fields:
      - name: items
        label: 사례 목록
        type: object
        list: true
        fields:
          - { name: slug, label: 주소용 영문 이름 (예 sinsa-clinic), type: string }
          - { name: published, label: 사이트에 공개, type: boolean }
          - name: type
            label: 분류
            type: select
            options:
              values:
                - { value: shop, label: 상가 }
                - { value: office, label: 사무실 }
                - { value: food, label: 음식점·카페 }
                - { value: clinic, label: 병의원 }
          - { name: title, label: 제목, type: string }
          - { name: summary, label: 요약, type: text }
          - { name: cover, label: 대표 사진, type: image }
          - { name: poster, label: 매물 포스터, type: image }
          - { name: gallery, label: 추가 사진, type: image, list: true }
          - name: conditions
            label: 당시 검토 조건
            type: object
            list: true
            fields:
              - { name: label, label: 항목, type: string }
              - { name: value, label: 내용 (비우면 '기재 예정'), type: string }
          - { name: basis_note, label: 기준 안내 문구, type: text }
          - { name: checkpoints, label: 현장에서 살펴볼 포인트, type: string, list: true }
          - { name: client, label: 고객 소개 (예 압구정로데오 카페 대표 · 재계약), type: string }
          - { name: pros, label: 고객이 말한 좋았던 점, type: string, list: true }
          - { name: cons, label: 고객이 말한 아쉬웠던 점, type: string, list: true }
          - { name: video_url, label: 인터뷰 영상 주소 (유튜브), type: string }
          - { name: source_url, label: 후기 원문 주소 (인스타그램·당근 등), type: string }
          - { name: consent, label: 고객이 공개에 동의함 (체크해야 후기가 보임), type: boolean }

  - name: listings
    label: 단독 매물
    type: file
    path: content/listings.json
    fields:
      - { name: intro, label: 페이지 소개 문장, type: text }
      - name: items
        label: 매물 목록
        type: object
        list: true
        fields:
          - { name: slug, label: 주소용 영문 이름 (예 sinsa-663-26-2f), type: string, required: true }
          - { name: published, label: 사이트에 공개 (필수 항목이 다 차야 실제로 보임), type: boolean }
          - { name: exclusive, label: 단독 매물, type: boolean }
          - name: status
            label: 상태
            type: select
            options:
              values:
                - { value: available, label: 계약 가능 }
                - { value: negotiating, label: 협의 중 }
                - { value: closed, label: 계약 완료 (홈페이지에서 내려감) }
          - { name: title, label: 제목, type: string }
          - { name: headline, label: 제목 위 한 줄 (예 병·의원 추천 매물), type: string }
          - { name: summary, label: 설명, type: text }
          - { name: recommended, label: 추천 업종, type: string }
          - { name: highlights, label: 특징 태그, type: string, list: true }
          - { name: photos, label: 사진 (첫 장이 대표), type: image, list: true }
          - { name: poster, label: 홍보 이미지 원본, type: image }
          - name: deal_type
            label: 거래 형태 (필수)
            type: select
            options:
              values:
                - { value: lease, label: 임대 }
                - { value: sale, label: 매매 }
          - { name: property_kind, label: 중개대상물 종류 (필수 · 건축물대장 용도 예 제2종 근린생활시설), type: string }
          - { name: address, label: 소재지 (필수), type: string }
          - { name: floor, label: 해당 층 (필수), type: string }
          - { name: total_floors, label: 총 층수 (필수 · 예 지하1층/지상5층), type: string }
          - { name: area_m2, label: 면적 ㎡ (필수 · 숫자만), type: string }
          - { name: area_py, label: 면적 평 (숫자만), type: string }
          - { name: area_basis, label: 면적 기준 (예 건축물대장 전용면적), type: string }
          - { name: deposit, label: 보증금 (임대 필수), type: string }
          - { name: rent, label: 월 임대료 (임대 필수), type: string }
          - { name: sale_price, label: 매매가 (매매 필수), type: string }
          - { name: premium, label: 권리금 (예 무권리), type: string }
          - { name: maintenance, label: 관리비 (필수), type: string }
          - { name: maintenance_items, label: 관리비 포함 항목, type: string }
          - { name: approval_date, label: 사용승인일 (필수 · 건축물대장), type: string }
          - { name: direction, label: 방향 (필수 · 예 남향 · 주출입구 기준), type: string }
          - { name: move_in, label: 입주 가능일 (필수 · 예 즉시 입주 / 협의), type: string }
          - { name: parking, label: 주차 대수 (필수 · 예 건물 총 3대), type: string }
          - { name: checkpoints, label: 현장에서 함께 확인할 점, type: string, list: true }
          - { name: note, label: 기타, type: text }
          - { name: checked_on, label: 정보 확인일 (YYYY-MM-DD), type: string }

  - name: insights
    label: 상권 인사이트 (상권 분석·칼럼)
    type: file
    path: content/insights.json
    fields:
      - name: items
        label: 글 목록
        type: object
        list: true
        fields:
          - { name: slug, label: 주소용 영문 이름, type: string }
          - { name: published, label: 사이트에 공개, type: boolean }
          - { name: category, label: 분류, type: string }
          - { name: title, label: 제목, type: string }
          - { name: summary, label: 요약, type: text }
          - { name: date, label: 작성일, type: date }
          - { name: cover, label: 대표 사진 (선택), type: image }
          - name: body
            label: 본문
            type: rich-text
            options:
              format: html
          - name: sources
            label: 수치 출처 (수치를 썼다면 필수)
            type: object
            list: true
            fields:
              - { name: name, label: 출처 이름, type: string }
              - { name: url, label: 링크, type: string }
              - { name: as_of, label: 기준 시점, type: string }

  - name: history
    label: 회사 연혁·거래 기록
    type: file
    path: content/history.json
    fields:
      - { name: intro, label: 코너 소개 문장, type: text }
      - { name: background, label: 배경 사진 (압구정로데오 거리 전경 · 가로 2400px 이상), type: image }
      - { name: background_alt, label: 배경 사진 설명, type: string }
      - { name: background_credit, label: 사진 출처 표기 (구매·촬영자), type: string }
      - name: founded
        label: 시작 기록
        type: object
        fields:
          - { name: year, label: 연도, type: string }
          - { name: text, label: 내용, type: string }
      - name: items
        label: 거래 기록 (공개 전 체크리스트를 꼭 확인하세요)
        type: object
        list: true
        fields:
          - { name: date, label: 계약 연월 (일자는 1일로 두어도 됩니다), type: date }
          - name: deal_type
            label: 거래 유형
            type: select
            options:
              values: [ { value: lease, label: 임대 }, { value: sale, label: 매매 }, { value: sublease, label: 전대 }, { value: etc, label: 기타 } ]
          - name: property
            label: 용도
            type: select
            options:
              values: [ { value: shop, label: 상가 }, { value: office, label: 사무실 }, { value: clinic, label: 병의원 }, { value: building, label: 건물 }, { value: etc, label: 기타 } ]
          - { name: industry, label: "업종 (예: 뷰티 브랜드, 패션 편집숍, 카페)", type: string }
          - { name: area, label: "공개 위치 (동·거리 수준만. 예: 압구정로데오 이면 골목. 번지·층·호수 금지)", type: string }
          - name: disclosure
            label: 공개 범위
            type: select
            options:
              values: [ { value: industry, label: "업종만 공개 (기본)" }, { value: name, label: "상호명 공개 (고객 서면 동의 필수)" }, { value: hidden, label: 사이트에 표시 안 함 } ]
          - { name: brand_name, label: "상호명 (상호명 공개 + 동의 확인일 때만 표시)", type: string }
          - { name: consent, label: "고객에게 상호·업종 공개 동의를 받았습니다 (문자·메일 등 기록 보관)", type: boolean }
          - { name: note, label: "한 줄 설명 (선택. 금액·조건·개인 이름 금지)", type: string }
          - { name: published, label: 사이트에 공개, type: boolean }

  - name: news
    label: NEWS (부동산 소식)
    type: file
    path: content/news.json
    fields:
      - { name: intro, label: 코너 소개 문장, type: text }
      - name: items
        label: 소식 목록 (기사 문장을 그대로 옮기지 말고 요약 + 출처 필수)
        type: object
        list: true
        fields:
          - { name: slug, label: "주소용 영문 이름 (예: 2026-11-30-rent-law)", type: string }
          - { name: published, label: 사이트에 공개, type: boolean }
          - { name: date, label: 게시일, type: date }
          - name: category
            label: 분류
            type: select
            options:
              values: [ { value: policy, label: 정책·법률 }, { value: incident, label: 사건·사고 }, { value: market, label: 시장·시세 }, { value: presale, label: 신규 분양 }, { value: rodeo, label: 로데오 상권 } ]
          - { name: title, label: 제목, type: string }
          - { name: summary, label: "핵심 요약 (2~3문장, 직접 쓴 문장으로)", type: text }
          - name: body
            label: 본문 (선택)
            type: rich-text
            options:
              format: html
          - { name: opinion, label: "현장의 한마디 (견해)", type: text }
          - { name: opinion_by, label: "한마디 작성자 (예: 김태욱 공인중개사)", type: string }
          - name: sources
            label: 출처 (최소 1개)
            type: object
            list: true
            fields:
              - { name: name, label: "출처 이름 (예: 국토교통부 보도자료)", type: string }
              - { name: url, label: 링크, type: string }
              - { name: date, label: 발표일, type: string }

  - name: qna
    label: Q&A (자주 묻는 질문·답변)
    type: file
    path: content/qna.json
    fields:
      - { name: intro, label: 코너 소개 문장, type: text }
      - name: faq
        label: 자주 묻는 질문 (묶음별)
        type: object
        list: true
        fields:
          - { name: group, label: "묶음 이름 (예: 로데오 상권)", type: string }
          - name: items
            label: 질문들
            type: object
            list: true
            fields:
              - { name: q, label: 질문, type: string }
              - { name: a, label: 답변, type: text }
